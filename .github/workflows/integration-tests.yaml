name: Integration Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  versions:
    name: ${{ matrix.name }}
    runs-on: ubuntu-26.04
    strategy:
      # Report both results; a failure on one version is useful to see next to
      # a pass on the other.
      fail-fast: false
      matrix:
        include:
          # Kept in step with the matrix in tests.yaml — see the reasoning
          # there. It matters more here: the device-ownership tests live in
          # this suite, and release_device_ownership() is exactly the code
          # whose behaviour differs between the floor and the ceiling.
          - name: HA ceiling (uv.lock)
            slug: ha-ceiling
            ha: ""
          - name: HA floor (2026.7)
            slug: ha-floor
            ha: homeassistant==2026.7.*
            drop: probatio
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-suffix: integration-tests-${{ matrix.slug }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version

      - name: Verify uv.lock matches pyproject.toml
        run: uv lock --check
      # --no-default-groups: uv treats `dev` as a default group, so plain
      # `--group test` would still pull mypy into the test matrix.
      - name: Install the locked environment
        run: uv sync --no-default-groups --group test --frozen

      - name: Select the Home Assistant under test
        if: matrix.ha != ''
        run: >-
          uv pip install "${{ matrix.ha }}"
          pytest-homeassistant-custom-component

      - name: Drop packages the HA under test does not ship
        if: matrix.drop
        run: uv pip uninstall ${{ matrix.drop }}

      - name: Home Assistant under test
        run: >-
          uv run --no-sync python -c "from homeassistant.const import
          __version__; print(__version__)"

      - name: Integration tests
        run: uv run --no-sync python -m pytest tests/integration/ -v

  # Stable name for branch protection to require. The matrix jobs are named
  # after the HA version they run, so their check names move every time the
  # floor or ceiling is bumped — a required check pinned to one of those would
  # silently stop reporting and block every PR forever. This one never changes
  # its name and just mirrors the matrix result.
  #
  # `if: always()` matters: without it this is skipped when a matrix leg fails,
  # the required check never reports, and the PR is blocked rather than failed.
  integration-tests:
    needs: versions
    if: always()
    runs-on: ubuntu-26.04
    steps:
      - name: Mirror the matrix result
        run: |
          echo "matrix result: ${{ needs.versions.result }}"
          [ "${{ needs.versions.result }}" = "success" ]
